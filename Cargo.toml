[package]
name = "rustgb"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Groebner basis engine for Singular (polynomial layer only -- see ~/project/docs/rust-bba-port-plan.md)"

[lib]
# `cdylib` produces librustgb.so for the Singular dyn_module to
# dlopen / link against; `rlib` keeps the crate usable as a normal
# Rust dependency for tests and examples.
crate-type = ["cdylib", "rlib"]

[dependencies]
# stdlib only for now; add as needed.

[features]
default = ["redtail", "flat_lset", "shortest_reducer", "pairorder_lm", "pair_mask_or", "compact_scan"]

# Default reducer is the geobucket (ADR-002). Enabling this feature
# switches `bba::reduce_lobject` to the heap-based Monagan-Pearce
# reducer (ADR-008). Both reducers are always compiled; the flag
# only chooses which one bba uses internally. Cross-validation
# tests in `bba` always exercise both regardless of flag state.
heap_reducer = []

# Per-step `redTail`-style tail reduction during the bba main loop
# (ADR-024). When ON (default), each freshly-produced basis element
# `h` has its tail reduced against the current basis BEFORE it is
# inserted, mirroring Singular's `kInterRed` / `redtailBba` step
# under `OPT_REDTAIL`. When OFF, only the post-hoc `tail_reduce_all`
# pass at the end runs (preserves earlier behaviour for A/B). The
# final output is the unique reduced GB in either case — toggling
# this flag must NOT change fixture-match outcomes.
redtail = []

# Switch the `Poly` type from the default flat-array backend
# (`poly_vec`) to the singly-linked-list backend (`poly_list`).
# Off by default — ADR-001's staging-5101449 profile evidence
# still favours flat arrays. Enable with
# `cargo build --features linked_list_poly` to A/B test the
# linked-list shape against the flat-array shape, or to exercise
# the second backend through the same test suite. See ADR-014
# for the rationale behind keeping both backends available.
linked_list_poly = []

# Thread-local free-list-backed Node allocator for the
# linked_list_poly backend. Requires linked_list_poly. When off,
# Node allocations forward to Box::new / Box::from_raw. See
# ADR-016 for the rationale and measured impact.
linked_list_poly_pool = []

# Switch the public `LSet` type to the flat-Vec backend
# (`src/lset_flat.rs`) with parallel `lcm_divmasks: Vec<u64>`
# enabling SIMD-batched filtered scans for the chain-criterion
# Phase-2 sweep. **On by default** since 2026-06-08: the c200-1 A/B
# measured −8 to −9 % wall vs the heap backend on all three staging
# tests (`~/project/reports/rustgb-lset-flat-bench-report.md`,
# ADR-026). The heap backend (`src/lset.rs`) is retained and
# compilable; build `--no-default-features --features redtail` to
# select it. Both backend modules always compile; only the public
# alias chosen by `lib.rs` differs. The contract tests under
# `tests/lset_contract.rs` exercise whichever backend is selected.
flat_lset = []

# Shortest-reducer divisor selection (ADR-032). OFF by default. When
# ON, `bba::find_divisor_idx` scans ALL divmask-passing non-redundant
# dividing candidates and returns the one with the fewest terms
# (cached in `SBasis::lengths`), with Singular's `if (li<3) break;`
# early-out. This is the analog of Singular's `redHoney`/`redHomog`
# shortest / lowest-ecart reducer selection. A throwaway probe measured
# −35 % total reduction subtracts, output bit-identical
# (`~/project/reports/rustgb-nextopt-perop-comparison.md`). With the
# feature OFF, `find_divisor_idx` returns the first divisor in arrival
# order, byte-for-byte the pre-ADR-032 behaviour. The `SBasis::lengths`
# cache is maintained unconditionally (cheap); only the selection scan
# is gated. Promote to a default only after the c200-1 wall A/B.
shortest_reducer = []

# S-pair processing order by (sugar, LCM) — Singular's compareL15
# (ADR-034). OFF by default for a clean A/B. When ON, the L-queue's
# tie-break among equal-sugar pairs is the LCM's order-preserving
# degrevlex key (`Pair::lcm_ord_key`) instead of arrival order —
# matching Singular's `compareL15` = (GetpFDeg + ecart, then pLmCmp)
# = (sugar, then leading-monomial of the LCM). pop() takes the
# minimum (sugar, lcm_ord_key, idx) = compareL15's top(). This is the
# classic normal selection strategy: processing equal-sugar pairs in
# LCM order builds the low part of the basis first, so later
# S-polynomials reduce against a more-complete basis -> far less
# intermediate swell. A throwaway probe measured −30 % total
# reduction subtracts, output bit-identical
# (`~/project/reports/rustgb-nextopt-perop-comparison.md`). With the
# feature OFF, the tie-break is `arrival`, byte-for-byte the prior
# (sugar, arrival, idx) behaviour. `lcm_ord_key` is computed
# unconditionally in `Pair::new` (cheap, where the ring is in hand);
# only the L-queue sort key selects between arrival and lcm_ord_key.
# Stacks with ADR-032 (shortest_reducer) — independent levers.
# Promote to a default only after the c200-1 wall A/B.
pairorder_lm = []

# OR-composed pair LCM masks (ADR-035). **On by default** since
# 2026-06-10: the c200-1 same-campaign A/B measured −8.2 / −10.7 /
# −10.0 % wall on the three staging tests, Δwall ≈ Δinstr, output
# bit-identical (`~/project/profile-data/`
# `rustgb-pair-mask-or-fused-chaincrit-ab-c200-1.csv`). When ON,
# `Pair::new_from_masks` obtains the LCM's SEV and divmask as the
# bitwise OR of the two operands' cached masks — exact, because both
# schemes are threshold-monotone and the LCM is the componentwise max
# (`mask(lcm(a,b)) = mask(a) | mask(b)`). This replaces the per-pair
# `compute_sev` + `divmask_of` recompute (the profile's finding A:
# `Ring::divmask_of` alone is 7.96 % of wall) with two ORs at the
# `enter_one_pair_normal` / `build_pair` call sites, where both operand
# masks are already in hand. With the feature OFF, `Pair::new`
# recomputes from the LCM exponents, byte-for-byte the pre-ADR-035
# behaviour. Output is bit-identical either way — the masks are equal
# values, only cheaper to obtain. Debug builds re-verify the OR
# identity in `Pair::assert_canonical`.
pair_mask_or = []

# Divisor-scan volume counters (task 389, finding C). OFF by default;
# every counter is `#[cfg(feature = "scan_stats")]`-gated so the
# production build pays nothing. When ON, `bba::find_divisor_idx` and
# `reduce_tail` accumulate per-call-site scan-volume statistics
# (scans, eligible/swept elements, divmask/divides hit counts,
# early-out counts+positions, plus the redtail per-leader
# `divmask_of` count). Dumped to stderr at the end of
# `compute_gb_serial` when the `RUSTGB_SCAN_STATS=1` env var is set,
# one machine-greppable `SCANSTAT ...` line per call site. Pure
# instrumentation — does not change the computed basis. See
# `~/project/reports/rustgb-divscan-probe-report.md`.
scan_stats = []

# Per-event operation trace (task 392). OFF by default; every call
# site is `#[cfg(feature = "step_trace")]`-gated so the production
# build has no trace code. When ON, `compute_gb_serial` emits a
# canonical, index-free trace of the bba run (POP/RES/INS for the
# trajectory skeleton; NEW/KILL pair events behind verbosity level 2)
# to the file named by `RUSTGB_TRACE_FILE`, for diffing against an
# equivalently-instrumented Singular run to localize where the two
# engines' operation streams diverge. Verbosity is `RUSTGB_TRACE_LEVEL`
# (1 = phase A, 2 = +phase B). Pure instrumentation — does not change
# the computed basis. See `~/project/reports/rustgb-step-trace-report.md`.
step_trace = []

# Compacted divisor-scan arrays (ADR-037, task 390). **On by default**
# since 2026-06-10: the c200-1 same-campaign A/B measured −2.5 / −1.3 /
# −3.8 % wall on the three staging tests on top of ADR-038, Δwall ≈
# Δinstr, output bit-identical
# (`~/project/profile-data/rustgb-scan-compact-swar-ab-c200-1.csv`).
# Feature-off is byte-for-byte the prior behaviour. When ON, `SBasis` maintains parallel scan arrays
# (`scan_divmasks`/`scan_lms`/`scan_lengths` + a `scan_basis_idx`
# back-map) that hold ONLY the live (non-redundant) elements, in
# ascending arrival order. `bba::find_divisor_idx` then sweeps the live
# set instead of the padded S-basis — the probe (finding H4,
# `~/project/reports/rustgb-divscan-probe-report.md`) measured the
# redundant padding at ~1.11× array length on staging-5101449, ~23 % of
# the head-scan excess (~0.1 s / ~1.5 % wall). Removal is an ordered
# shift-down (NOT swap-remove), so the relative arrival order of live
# elements is preserved and `find_divisor_idx`'s first-found tie-break
# stays bit-identical. The unconditional lever — does not touch ADR-032's
# shortest-reducer selection, only the array it scans over.
compact_scan = []

[dev-dependencies]
proptest = "1"

# Sanitisers are available only with `-Z sanitizer=thread` on nightly.
# No build configuration needed in Cargo.toml.

[profile.release]
debug = true   # keep symbols for profiling
