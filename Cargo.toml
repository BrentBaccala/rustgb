[package]
name = "rustgb"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Groebner basis engine for Singular (polynomial layer only -- see ~/project/docs/rust-bba-port-plan.md)"

[lib]
# `cdylib` produces librustgb.so for the Singular dyn_module to
# dlopen / link against; `rlib` keeps the crate usable as a normal
# Rust dependency for tests and examples.
crate-type = ["cdylib", "rlib"]

[dependencies]
# stdlib only for now; add as needed.

[features]
default = ["redtail", "flat_lset"]

# Default reducer is the geobucket (ADR-002). Enabling this feature
# switches `bba::reduce_lobject` to the heap-based Monagan-Pearce
# reducer (ADR-008). Both reducers are always compiled; the flag
# only chooses which one bba uses internally. Cross-validation
# tests in `bba` always exercise both regardless of flag state.
heap_reducer = []

# Per-step `redTail`-style tail reduction during the bba main loop
# (ADR-024). When ON (default), each freshly-produced basis element
# `h` has its tail reduced against the current basis BEFORE it is
# inserted, mirroring Singular's `kInterRed` / `redtailBba` step
# under `OPT_REDTAIL`. When OFF, only the post-hoc `tail_reduce_all`
# pass at the end runs (preserves earlier behaviour for A/B). The
# final output is the unique reduced GB in either case — toggling
# this flag must NOT change fixture-match outcomes.
redtail = []

# Switch the `Poly` type from the default flat-array backend
# (`poly_vec`) to the singly-linked-list backend (`poly_list`).
# Off by default — ADR-001's staging-5101449 profile evidence
# still favours flat arrays. Enable with
# `cargo build --features linked_list_poly` to A/B test the
# linked-list shape against the flat-array shape, or to exercise
# the second backend through the same test suite. See ADR-014
# for the rationale behind keeping both backends available.
linked_list_poly = []

# Thread-local free-list-backed Node allocator for the
# linked_list_poly backend. Requires linked_list_poly. When off,
# Node allocations forward to Box::new / Box::from_raw. See
# ADR-016 for the rationale and measured impact.
linked_list_poly_pool = []

# Switch the public `LSet` type to the flat-Vec backend
# (`src/lset_flat.rs`) with parallel `lcm_divmasks: Vec<u64>`
# enabling SIMD-batched filtered scans for the chain-criterion
# Phase-2 sweep. **On by default** since 2026-06-08: the c200-1 A/B
# measured −8 to −9 % wall vs the heap backend on all three staging
# tests (`~/project/reports/rustgb-lset-flat-bench-report.md`,
# ADR-026). The heap backend (`src/lset.rs`) is retained and
# compilable; build `--no-default-features --features redtail` to
# select it. Both backend modules always compile; only the public
# alias chosen by `lib.rs` differs. The contract tests under
# `tests/lset_contract.rs` exercise whichever backend is selected.
flat_lset = []

[dev-dependencies]
proptest = "1"

# Sanitisers are available only with `-Z sanitizer=thread` on nightly.
# No build configuration needed in Cargo.toml.

[profile.release]
debug = true   # keep symbols for profiling
